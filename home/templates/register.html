{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="col-md-5 mx-auto mt-5 p-4 bg-black bg-opacity-50 rounded">
  <h2 class="mb-3">Ro‘yxatdan o‘tish</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Ism</label>
      <input type="text" name="first_name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Familiya</label>
      <input type="text" name="last_name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Parol</label>
      <input type="password" name="password1" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Parolni tasdiqlang</label>
      <input type="password" name="password2" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Ro‘yxatdan o‘tish</button>
  </form>
  <p class="mt-3 text-center">
    Allaqachon ro‘yxatdan o‘tganmisiz? <a href="{% url 'login' %}">Login</a>
  </p>
</div>
{% endblock %}
