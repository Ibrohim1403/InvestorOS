{% load static %}
<!doctype html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <title>{% block title %}Investor OS{% endblock %}</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script>
    if (localStorage.getItem("dark-mode") === "enabled") {
      document.body.classList.add("dark-mode");
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <!-- Dark Mode JS -->
  <script src="{% static 'css/js/darkmode.js' %}"></script>
</head>

<body class="{% if request.COOKIES.dark_mode == 'enabled' %}dark-mode{% endif %}">
<div class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Investor OS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto text-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'morning_brief' %}">Morning Brief</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'analytics' %}">Analytics</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'settings' %}">Settings</a></li>
        </ul>

        <!-- Profil dropdown -->
        {% if request.user.is_authenticated %}
        <div class="dropdown ms-3">
          <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" 
             id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="{% static 'img/profile.png' %}" alt="Profil" 
                 class="rounded-circle border border-light" width="40" height="40">
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small shadow" aria-labelledby="profileDropdown">
            <li class="dropdown-item-text">
              <strong>{{ request.user.email }}</strong>
            </li>
          </ul>
        </div>
        {% endif %}

        <!-- Dark Mode tugma -->
        <button id="darkModeToggle" class="btn btn-outline-light ms-3">
          🌙 Dark Mode
        </button>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="container py-5 flex-grow-1" style="margin-top: 70px;">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-3 mt-auto">
    <p class="m-0">&copy; 2025 Investor OS</p>
  </footer>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Dark Mode JS -->
<script src="{% static 'js/darkmode.js' %}"></script>
</body>
</html>
