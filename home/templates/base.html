{% load static %}
<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Investor OS{% endblock %}</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Investor OS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto text-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'morning_brief' %}">Morning Brief</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'analytics' %}">Analytics</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'settings' %}">Settings</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="container py-5" style="margin-top: 70px;">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-3 mt-5">
    <p class="m-0">&copy; 2025 Investor OS</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
